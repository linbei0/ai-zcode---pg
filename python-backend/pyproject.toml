[project]
name = "ai-zcode-python-backend"
version = "0.1.0"
description = "FastAPI + LangChain backend for AI-ZCode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.135.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "orjson>=3.11.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.8.0",
    "redis>=6.0.0",
    "sqlalchemy>=2.0.39",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
aizcode-dev = "app.dev_launcher:main"

[dependency-groups]
dev = [
    "fakeredis>=2.31.0",
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
addopts = "-q"
